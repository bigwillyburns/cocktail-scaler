# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: CocktailScaler
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CocktailScaler:
    type: application
    platform: iOS
    sources: [CocktailScaler]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CocktailScaler
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cocktail Scaler
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  CocktailScalerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CocktailScalerTests]
    dependencies:
      - target: CocktailScaler
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CocktailScaler:
    build:
      targets:
        CocktailScaler: all
        CocktailScalerTests: [test]
    test:
      targets: [CocktailScalerTests]
