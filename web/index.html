<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cocktails</title>
  <meta name="description" content="Build cocktail recipes, calculate their ABV and scale them to any batch size.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cocktails">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm" class="sheet" aria-labelledby="confirm-title">
    <form method="dialog">
      <div class="sheet-card">
        <p class="sheet-title" id="confirm-title"></p>
        <p class="sheet-message" id="confirm-message"></p>
        <button class="sheet-btn destructive" value="ok" id="confirm-ok"></button>
      </div>
      <button class="sheet-btn sheet-cancel" value="cancel">Cancel</button>
    </form>
  </dialog>
  <noscript><p class="noscript">This app needs JavaScript turned on.</p></noscript>
  <script src="bottles.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
